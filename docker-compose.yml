services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codeviz-backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    env_file:
      - ./backend/.env
    restart: unless-stopped
    volumes:
      - backend_temp:/tmp

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codeviz-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_temp: